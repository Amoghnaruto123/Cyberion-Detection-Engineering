title: Suspicious PowerShell Access to LSASS
id: 3e7b1d91-8c42-4a65-9d21-7f3a2b6c8e10
status: experimental
description: Detects PowerShell accessing LSASS with a credential-dumping access mask, excluding an explicitly approved diagnostic path.
author: Cyberion Detection Engineering
date: 2026-11-10
references:
    - https://attack.mitre.org/techniques/T1003/
tags:
    - attack.credential-access
    - attack.t1003
logsource:
    product: windows
    category: process_access
detection:
    selection:
        EventID: 10
        SourceImage|endswith: '\powershell.exe'
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess: '0x1010'
    filter_approved_diagnostics:
        SourceImage|startswith: 'C:\Program Files\Contoso\Diagnostics\'
    condition: selection and not filter_approved_diagnostics
falsepositives:
    - Approved diagnostic tooling accessing LSASS from the explicitly allowlisted path
level: high
