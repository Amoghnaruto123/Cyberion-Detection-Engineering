title: Suspicious Command Shell Spawned by FTP Client
id: 7c4a9e21-5b63-4d82-9f10-6a2c8e5b3d71
status: experimental
description: Detects Windows Command Prompt launched by the FTP client, potentially indicating suspicious command execution through FTP scripting.
author: Cyberion Detection Engineering
date: 2026-11-03
references:
    - https://attack.mitre.org/techniques/T1059/003/
tags:
    - attack.execution
    - attack.t1059
    - attack.t1059.003
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        EventID: 1
        Image|endswith: '\cmd.exe'
        ParentImage|endswith: '\ftp.exe'
    condition: selection
falsepositives:
    - Legitimate administrative FTP scripts launching command-line processes
level: high
