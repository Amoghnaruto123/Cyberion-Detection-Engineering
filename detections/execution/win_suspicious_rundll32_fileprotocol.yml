title: Suspicious Rundll32 File Protocol Handler Execution
id: 9a2e7c41-6d83-4b15-a920-5f7c3e1d8642
status: experimental
description: Detects Rundll32 using url.dll FileProtocolHandler to open local files, which may indicate proxy execution abuse.
author: Cyberion Detection Engineering
date: 2026-11-03
references:
    - https://attack.mitre.org/techniques/T1218/011/
tags:
    - attack.t1218
    - attack.t1218.011
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        EventID: 1
        Image|endswith: '\rundll32.exe'
        CommandLine|contains|all:
            - 'url.dll,FileProtocolHandler'
            - 'file://'
    condition: selection
falsepositives:
    - Legitimate applications using Rundll32 to open local file URLs
level: high

