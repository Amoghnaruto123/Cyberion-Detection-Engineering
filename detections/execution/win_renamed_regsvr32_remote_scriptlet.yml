title: Renamed Regsvr32 Executing Remote Scriptlet
id: 4b8e2d71-9c35-4f60-a128-7d6e3b5c9042
status: experimental
description: Detects a renamed executable masquerading as the Windows Register Server and using remote scriptlet execution arguments, excluding an approved deployment agent.
author: Cyberion Detection Engineering
date: 2026-11-10
references:
    - https://attack.mitre.org/techniques/T1218/010/
tags:
    - attack.t1218
    - attack.t1218.010
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        EventID: 1
        Description: 'Microsoft(C) Register Server'
        CommandLine|contains|all:
            - '/i:'
            - 'http'
            - '.dll'
    filter_approved_deployment:
        ParentImage|startswith: 'C:\Program Files\Contoso\DeploymentAgent\'
    condition: selection and not filter_approved_deployment
falsepositives:
    - Approved internal software deployment utilities registering remote DLL scriptlets
level: high
