title: Suspicious Mshta Execution from Internet Cache
id: 5c9d2e71-8a43-4f60-b127-3e6d9a5c8042
status: experimental
description: Detects Mshta executing HTA files from the Internet Explorer temporary internet files directory.
author: Cyberion Detection Engineering
date: 2026-11-04
references:
    - https://attack.mitre.org/techniques/T1218/005/
tags:
    - attack.t1218
    - attack.t1218.005
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        EventID: 1
        Image|endswith: '\mshta.exe'
        CommandLine|contains|all:
            - 'Temporary Internet Files'
            - '.hta'
    condition: selection
falsepositives:
    - Legitimate web applications launching HTA files from browser cache
level: high
